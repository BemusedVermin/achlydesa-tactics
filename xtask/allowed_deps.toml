# Internal edges: crate -> crates it may depend on (normal deps).
[internal]
ach_core      = []
ach_world     = ["ach_core"]
ach_sched     = ["ach_core"]
ach_people    = ["ach_core"]
ach_logistics = ["ach_core"]
ach_text      = ["ach_core"]
ach_know      = ["ach_core", "ach_world", "ach_sched"]
ach_orders    = ["ach_core", "ach_know"]
ach_ai        = ["ach_core", "ach_orders", "ach_know", "ach_world", "ach_people"]
ach_combat    = ["ach_core", "ach_world", "ach_people"]
ach_anomaly   = ["ach_core", "ach_know", "ach_world", "ach_logistics"]
ach_narrative = ["ach_core", "ach_know", "ach_people"]
ach_affect    = ["ach_core", "ach_know"]
ach_plate     = ["ach_core", "ach_world", "ach_anomaly"]
ach_sim       = ["ach_core", "ach_world", "ach_sched", "ach_people", "ach_logistics",
                 "ach_know", "ach_orders", "ach_ai", "ach_combat", "ach_anomaly",
                 "ach_narrative", "ach_affect"]
ach_tools     = ["*"]

# External crates: name -> crates allowed to use it ("*" = any). dev-dependencies are checked too.
[external]
serde      = ["*"]
thiserror  = ["*"]
postcard   = ["ach_core"]
ron        = ["ach_world", "ach_people", "ach_logistics", "ach_text", "ach_sim", "ach_tools"]
indexmap   = ["ach_core", "ach_world", "ach_sched", "ach_people", "ach_logistics", "ach_text", "ach_sim"]
proptest   = ["*"]
insta      = ["*"]
clap       = ["ach_tools", "xtask"]
ratatui    = ["ach_tools"]
crossterm  = ["ach_tools"]
image      = ["ach_tools", "spikes/*"]
tiff       = ["ach_tools"]
toml       = ["xtask"]
serde_json = ["xtask"]
anyhow     = ["ach_tools", "xtask", "spikes/*"]
