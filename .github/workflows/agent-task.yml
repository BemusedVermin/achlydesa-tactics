# Runs a task with Claude Code when a maintainer adds the `agent:run` label to its issue,
# or manually via "Run workflow" with a task ID. Only users with triage/write access can add labels.
name: Agent task
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      task_id:
        description: "Task ID, e.g. P1-02"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  run:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent:run'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: agent-task-${{ github.event.issue.number || inputs.task_id }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.ACHLYDESA_BOT_TOKEN }}   # bot PAT: repo, workflow, project scopes
      ISSUE_TITLE: ${{ github.event.issue.title }}   # passed via env, never interpolated into scripts
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      INPUT_TASK: ${{ inputs.task_id }}
    steps:
      - name: Check secrets
        env:
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Repository secret ACHLYDESA_BOT_TOKEN is missing or empty. Add it under the repo's Actions secrets (see docs/tasks/H-1.md step 2), e.g. gh secret set ACHLYDESA_BOT_TOKEN < token-file"
            exit 1
          fi
          if [ -z "$CLAUDE_TOKEN" ]; then
            echo "::error::Repository secret CLAUDE_CODE_OAUTH_TOKEN is missing or empty (see docs/tasks/H-1.md step 3). If you use an API key instead, edit this check and the claude-code-action inputs."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ACHLYDESA_BOT_TOKEN }}   # pushes by a PAT trigger CI; GITHUB_TOKEN pushes would not

      - name: Identify task
        id: task
        run: |
          if [ -n "$INPUT_TASK" ]; then ID="$INPUT_TASK"
          else ID="$(printf '%s' "$ISSUE_TITLE" | sed -nE 's/^([A-Z0-9]+(-[A-Z0-9]+)?) — .*/\1/p')"; fi
          # agent:run is a trigger, not a state: remove it so adding it again starts a new run.
          # Progress shows on the board (Status) and as a comment linking the run log.
          if [ -n "$ISSUE_NUMBER" ]; then gh issue edit "$ISSUE_NUMBER" --remove-label agent:run || true; fi
          if [ -z "$ID" ] || [ ! -f "docs/tasks/$ID.md" ]; then
            [ -n "$ISSUE_NUMBER" ] && gh issue comment "$ISSUE_NUMBER" --body "No task spec found for this issue title, so the agent did not run."
            echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          RUNS_ON="$(python3 tools/scripts/gh_task.py runs-on "$ID")"
          if [ "$RUNS_ON" != "either" ]; then
            [ -n "$ISSUE_NUMBER" ] && gh issue comment "$ISSUE_NUMBER" --body "$ID is marked **Runs on: $RUNS_ON**. Run it locally with \`/task $ID\`."
            echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Check readiness and mark In Progress
        if: steps.task.outputs.skip != '1'
        env:
          ID: ${{ steps.task.outputs.id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          test -f .github/project.json || { echo "::error::.github/project.json is not committed on the default branch. Run gh_task.py bootstrap locally and commit it."; exit 1; }
          if ! OUT="$(python3 tools/scripts/gh_task.py ready "$ID" 2>&1)"; then
            echo "$OUT"
            [ -n "$ISSUE_NUMBER" ] && gh issue comment "$ISSUE_NUMBER" --body "Agent did not start: $OUT"
            echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          python3 tools/scripts/gh_task.py stage "$ID" in-progress
          if [ -n "$ISSUE_NUMBER" ]; then gh issue comment "$ISSUE_NUMBER" --body "Agent started on $ID. Run log: $RUN_URL"; fi
        id: ready

      - name: Toolchains
        if: steps.task.outputs.skip != '1' && steps.ready.outputs.skip != '1'
        run: |
          git config user.name  "achlydesa-bot"
          git config user.email "achlydesa-bot@users.noreply.github.com"
          if [ -f rust-toolchain.toml ]; then rustup show active-toolchain || rustup toolchain install; fi

      - name: Run task with Claude Code
        if: steps.task.outputs.skip != '1' && steps.ready.outputs.skip != '1'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}   # or: anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.ACHLYDESA_BOT_TOKEN }}                  # verify this input name against the action's docs
          prompt: |
            You are running in GitHub Actions, non-interactively.
            Run task ${{ steps.task.outputs.id }} by following .claude/skills/task/SKILL.md exactly,
            with $ARGUMENTS = ${{ steps.task.outputs.id }}. `gh` is authenticated as the bot via GH_TOKEN.
          claude_args: |
            --model sonnet
            --max-turns 250
            --allowedTools "Read,Write,Edit,MultiEdit,Glob,Grep,Agent,Task,TodoWrite,WebSearch,WebFetch,Bash(cargo:*),Bash(git:*),Bash(gh:*),Bash(python3:*),Bash(pip:*),Bash(rustup:*),Bash(ls:*),Bash(mkdir:*),Bash(cat:*),Bash(grep:*),Bash(wc:*),Bash(diff:*),Bash(sha256sum:*)"

      - name: Hand off for review
        if: steps.task.outputs.skip != '1' && steps.ready.outputs.skip != '1'
        env:
          ID: ${{ steps.task.outputs.id }}
        run: |
          PR_URL="$(python3 tools/scripts/gh_task.py handoff "$ID")"
          if [ -n "$ISSUE_NUMBER" ]; then gh issue comment "$ISSUE_NUMBER" --body "Ready for review: $PR_URL"; fi

      - name: Report failure on the issue
        if: failure() && env.ISSUE_NUMBER != ''
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Agent run failed. Log: $RUN_URL"
