# Runs revision mode when a maintainer submits "Request changes" on a task PR,
# or adds the `changes-requested` label (fallback when the PR author is not a bot).
name: Agent revise
on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [labeled]

permissions:
  contents: read
  id-token: write

jobs:
  revise:
    if: >
      startsWith(github.event.pull_request.head.ref, 'task/') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (github.event_name == 'pull_request_review' && github.event.review.state == 'changes_requested' &&
         contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
        (github.event_name == 'pull_request' && github.event.label.name == 'changes-requested')
      )
    runs-on: ubuntu-24.04   # pinned: reproducible toolchain; revisit deliberately
    timeout-minutes: 150
    concurrency:
      group: agent-revise-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Check secrets
        env:
          GH_TOKEN: ${{ secrets.ACHLYDESA_BOT_TOKEN }}   # board/issue bookkeeping only
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Repository secret ACHLYDESA_BOT_TOKEN is missing or empty. Add it under the repo's Actions secrets (see docs/tasks/H-1.md step 2), e.g. gh secret set ACHLYDESA_BOT_TOKEN < token-file"
            exit 1
          fi
          if [ -z "$CLAUDE_TOKEN" ]; then
            echo "::error::Repository secret CLAUDE_CODE_OAUTH_TOKEN is missing or empty (see docs/tasks/H-1.md step 3). If you use an API key instead, edit this check and the claude-code-action inputs."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.ACHLYDESA_BOT_TOKEN }}

      - name: Identify task
        id: task
        env:
          GH_TOKEN: ${{ secrets.ACHLYDESA_BOT_TOKEN }}   # board/issue bookkeeping only
        run: |
          ID="$(printf '%s' "$HEAD_REF" | sed -nE 's#^task/([A-Z0-9]+(-[A-Z0-9]+)?)-.*#\1#p')"
          if [ -z "$ID" ] || [ ! -f "docs/tasks/$ID.md" ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          RUNS_ON="$(python3 tools/scripts/gh_task.py runs-on "$ID")"
          if [ "$RUNS_ON" != "either" ]; then
            gh pr comment "$PR_NUMBER" --body "$ID is marked **Runs on: $RUNS_ON**. Revise it locally with \`/task $ID\`."
            echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          test -f .github/project.json || { echo "::error::.github/project.json is not committed on the default branch."; exit 1; }
          python3 tools/scripts/gh_task.py stage "$ID" changes-requested
          echo "id=$ID" >> "$GITHUB_OUTPUT"

      - name: Toolchains
        if: steps.task.outputs.skip != '1'
        run: |
          git config user.name  "claude[bot]"
          git config user.email "claude[bot]@users.noreply.github.com"
          if [ -f rust-toolchain.toml ]; then rustup show active-toolchain || rustup toolchain install; fi

      - name: Revise with Claude Code
        if: steps.task.outputs.skip != '1'
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are running in GitHub Actions, non-interactively. Changes were requested on PR #${{ github.event.pull_request.number }}.
            Run task ${{ steps.task.outputs.id }} by following .claude/skills/task/SKILL.md exactly,
            with $ARGUMENTS = ${{ steps.task.outputs.id }}. You will be in revision mode.
            Follow the skill's operating rules: one command per Bash call (no cd, ;, &&, pipes, or redirects);
            run subagents in the foreground and wait for them; do not end your turn until the PR is open or updated.
          claude_args: |
            --model sonnet
            --max-turns 250
            --allowedTools "Read,Write,Edit,MultiEdit,Glob,Grep,Agent,Task,Skill,TodoWrite,BashOutput,WebSearch,WebFetch,Bash(cargo:*),Bash(rustup:*),Bash(git:*),Bash(gh:*),Bash(python3:*),Bash(python:*),Bash(pip:*),Bash(pip3:*),Bash(ls:*),Bash(cd:*),Bash(pwd),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(grep:*),Bash(find:*),Bash(wc:*),Bash(sort:*),Bash(uniq:*),Bash(cut:*),Bash(tr:*),Bash(sed:*),Bash(awk:*),Bash(jq:*),Bash(diff:*),Bash(cmp:*),Bash(echo:*),Bash(printf:*),Bash(test:*),Bash(mkdir:*),Bash(touch:*),Bash(cp:*),Bash(mv:*),Bash(rm:*),Bash(sha256sum:*),Bash(which:*),Bash(xargs:*),Bash(tee:*),Bash(basename:*),Bash(dirname:*),Bash(file:*),Bash(curl:*),Bash(wget:*),Bash(unzip:*),Bash(gunzip:*),Bash(tar:*)"

      - name: Summarize the Claude run
        if: always() && steps.claude.outcome != 'skipped' && steps.claude.outcome != ''
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          python3 tools/scripts/claude_run_summary.py "${EXEC_FILE:-/nonexistent}" > "$RUNNER_TEMP/claude-summary.md"
          cat "$RUNNER_TEMP/claude-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Hand off for review
        if: steps.task.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ secrets.ACHLYDESA_BOT_TOKEN }}   # board/issue bookkeeping only
          ID: ${{ steps.task.outputs.id }}
        run: |
          python3 tools/scripts/gh_task.py handoff "$ID"

      - name: Report failure on the PR
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.ACHLYDESA_BOT_TOKEN }}   # board/issue bookkeeping only
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          { echo "Agent revision failed. Log: $RUN_URL"; echo; cat "$RUNNER_TEMP/claude-summary.md" 2>/dev/null; } > "$RUNNER_TEMP/failure.md"
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/failure.md"
